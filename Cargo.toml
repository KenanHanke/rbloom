[package]
name = "rbloom"
version = "1.5.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rbloom"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = [
    "extension-module",
    "abi3-py39",
    "abi3t-py315",
] } # stable ABI with minimum Python version 3.9 (free-threaded: 3.15)
